<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Family List" />
  <meta name="theme-color" content="#0E4C63" />
  <title>Family List</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    :root{
      --bg-deep:#021422;
      --bg-mid:#073347;
      --bg-top:#0E4C63;
      --amber:#F2A93B;
      --amber-deep:#C77F1A;
      --ink:#F2F7F9;
      --muted:#9DB8C2;
      --panel:rgba(255,255,255,.06);
      --panel-border:rgba(255,255,255,.14);
      --navy:#0B2530;
      --green:#5FD08A;
      --red:#FF6B6B;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html{ background:var(--bg-top); }
    body{
      margin:0; padding:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 15% 0%, rgba(43,156,189,.12), transparent 40%),
        radial-gradient(circle at 100% 15%, rgba(29,152,193,.20), transparent 45%),
        linear-gradient(170deg, var(--bg-top), var(--bg-mid) 50%, var(--bg-deep));
      background-attachment:fixed;
      padding-bottom:110px;
    }
    /* ── Top bar ── */
    .topbar{
      position:sticky; top:0; z-index:100;
      background:rgba(8,28,38,.92);
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
      border-bottom:3px solid var(--amber);
      padding-top:env(safe-area-inset-top);
    }
    .topbar-inner{
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; padding:12px 16px;
    }
    .brand{ display:flex; align-items:center; gap:10px; }
    .brand-icon{
      width:42px; height:42px; border-radius:14px;
      background:linear-gradient(135deg, var(--amber), var(--amber-deep));
      display:flex; align-items:center; justify-content:center;
      font-size:24px; box-shadow:0 4px 14px rgba(242,169,59,.35);
    }
    .brand h1{ margin:0; font-size:20px; font-weight:800; letter-spacing:.3px; }
    .brand small{ display:block; font-size:11px; color:var(--muted); font-weight:600; }
    .who-chip{
      display:flex; align-items:center; gap:8px;
      background:var(--panel); border:1px solid var(--panel-border);
      border-radius:999px; padding:8px 14px; font-size:14px; font-weight:700;
      color:var(--ink); cursor:pointer;
    }
    .sync-dot{ width:10px; height:10px; border-radius:50%; background:var(--green); flex:none; }
    .sync-dot.syncing{ background:var(--amber); animation:pulse 1s infinite; }
    .sync-dot.offline{ background:var(--red); }
    @keyframes pulse{ 50%{ opacity:.4; } }
    /* ── List switcher ── */
    .listbar{
      display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px;
      -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    .listbar::-webkit-scrollbar{ display:none; }
    .list-chip{
      flex:none; border:1px solid var(--panel-border); background:var(--panel);
      color:var(--ink); border-radius:999px; padding:10px 18px;
      font-size:14px; font-weight:700; cursor:pointer; white-space:nowrap;
    }
    .list-chip.on{ background:var(--amber); border-color:var(--amber); color:#1a1206; }
    .list-chip.new{ border-style:dashed; color:var(--amber); }
    /* ── Content ── */
    .wrap{ padding:12px 16px 0; max-width:720px; margin:0 auto; }
    .list-head{
      background:var(--panel); border:1px solid var(--panel-border);
      border-radius:20px; padding:16px; margin-bottom:14px;
    }
    .list-head h2{ margin:0 0 2px; font-size:22px; font-weight:800; }
    .list-head .store{ color:var(--muted); font-size:13px; font-weight:600; margin:0 0 10px; }
    .progress{ height:8px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; margin:8px 0 6px; }
    .progress > div{ height:100%; background:linear-gradient(90deg, var(--amber), var(--amber-deep)); border-radius:99px; transition:width .3s; }
    .list-meta{ display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); font-weight:600; }
    .link-btn{ background:none; border:0; color:var(--red); font-size:12px; font-weight:700; cursor:pointer; padding:6px; }
    .link-btn.amber{ color:var(--amber); }
    /* ── Category groups ── */
    .cat-group{ margin-bottom:6px; }
    .cat-title{
      font-size:12px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
      color:var(--amber); margin:16px 4px 8px;
    }
    .item{
      display:flex; align-items:center; gap:12px;
      background:var(--panel); border:1px solid var(--panel-border);
      border-radius:16px; padding:12px 14px; margin-bottom:8px;
    }
    .check{
      width:32px; height:32px; flex:none; border-radius:50%;
      border:2px solid var(--muted); background:transparent; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      font-size:18px; color:transparent;
    }
    .item.done .check{ background:var(--green); border-color:var(--green); color:#06210f; }
    .item-body{ flex:1; min-width:0; }
    .item-name{ font-size:16px; font-weight:700; }
    .item.done .item-name{ text-decoration:line-through; color:var(--muted); }
    .item-sub{ font-size:12px; color:var(--muted); font-weight:600; margin-top:2px; }
    .item-note{
      font-size:13px; color:var(--ink); background:rgba(242,169,59,.12);
      border-left:3px solid var(--amber); border-radius:0 8px 8px 0;
      padding:6px 10px; margin-top:6px;
    }
    .item-edit{
      flex:none; width:40px; height:40px; border-radius:12px;
      border:1px solid var(--panel-border); background:transparent;
      color:var(--muted); font-size:18px; cursor:pointer;
    }
    .done-toggle{
      width:100%; background:var(--panel); border:1px dashed var(--panel-border);
      color:var(--muted); border-radius:16px; padding:12px;
      font-size:14px; font-weight:700; cursor:pointer; margin-top:10px;
    }
    .empty{
      text-align:center; color:var(--muted); padding:48px 20px;
      font-size:15px; font-weight:600; line-height:1.6;
    }
    .empty .big{ font-size:44px; display:block; margin-bottom:10px; }
    /* ── FAB ── */
    .fab{
      position:fixed; left:16px; right:16px;
      bottom:calc(16px + env(safe-area-inset-bottom));
      z-index:200; max-width:688px; margin:0 auto;
      background:linear-gradient(135deg, var(--amber), var(--amber-deep));
      color:#1a1206; border:0; border-radius:20px;
      font-size:18px; font-weight:800; padding:18px;
      cursor:pointer; box-shadow:0 8px 28px rgba(242,169,59,.4);
    }
    .fab:active{ transform:scale(.98); }
    /* ── Bottom sheet ── */
    .sheet-overlay{
      position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.55);
      display:none; align-items:flex-end; justify-content:center;
    }
    .sheet-overlay.open{ display:flex; }
    .sheet{
      width:100%; max-width:720px; max-height:88vh; max-height:88dvh;
      background:#0A2A3A; border-radius:24px 24px 0 0;
      border-top:1px solid var(--panel-border);
      padding:12px 18px calc(20px + env(safe-area-inset-bottom));
      overflow-y:auto; animation:slideup .25s ease;
    }
    @keyframes slideup{ from{ transform:translateY(40px); opacity:.6; } }
    .grabber{ width:44px; height:5px; border-radius:99px; background:rgba(255,255,255,.25); margin:4px auto 12px; }
    .sheet h3{ margin:0 0 12px; font-size:19px; font-weight:800; }
    .field{ margin-bottom:12px; }
    .field label{ display:block; font-size:12px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    .field input, .field select, .field textarea{
      width:100%; background:rgba(255,255,255,.07); border:1px solid var(--panel-border);
      border-radius:12px; color:var(--ink); font-size:16px; padding:12px 14px; font-family:inherit;
    }
    .field textarea{ min-height:64px; resize:vertical; }
    .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--amber); border-color:var(--amber); }
    .field select option{ background:#0A2A3A; }
    .qty-row{ display:flex; gap:10px; align-items:stretch; }
    .qty-step{
      width:52px; flex:none; border-radius:12px; border:1px solid var(--panel-border);
      background:var(--panel); color:var(--ink); font-size:22px; font-weight:800; cursor:pointer;
    }
    .qty-row input{ text-align:center; font-size:18px; font-weight:800; }
    .btn{
      display:block; width:100%; border:0; border-radius:14px;
      font-size:16px; font-weight:800; padding:15px; cursor:pointer; margin-top:6px;
    }
    .btn-primary{ background:linear-gradient(135deg, var(--amber), var(--amber-deep)); color:#1a1206; }
    .btn-ghost{ background:transparent; border:1px solid var(--panel-border); color:var(--muted); }
    .btn-danger{ background:rgba(255,107,107,.14); border:1px solid rgba(255,107,107,.4); color:var(--red); }
    .btn-row{ display:flex; gap:10px; }
    .btn-row .btn{ margin-top:10px; }
    /* catalog browser */
    .catchips{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; scrollbar-width:none; }
    .catchips::-webkit-scrollbar{ display:none; }
    .catchip{
      flex:none; border:1px solid var(--panel-border); background:var(--panel);
      color:var(--ink); border-radius:999px; padding:8px 14px;
      font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;
    }
    .catchip.on{ background:var(--amber); border-color:var(--amber); color:#1a1206; }
    .cat-result{ display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid rgba(255,255,255,.07); }
    .cat-result .nm{ flex:1; font-size:15px; font-weight:600; }
    .cat-result .ct{ font-size:11px; color:var(--muted); font-weight:700; }
    .mini-add{
      width:40px; height:40px; flex:none; border-radius:12px; border:0;
      background:var(--amber); color:#1a1206; font-size:20px; font-weight:800; cursor:pointer;
    }
    .cat-result .nm{ cursor:pointer; }
    /* ── Overlays: splash / name picker ── */
    .fullscreen{
      position:fixed; inset:0; z-index:500;
      background:linear-gradient(170deg, var(--bg-top), var(--bg-mid) 55%, var(--bg-deep));
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .fullscreen.hidden{ display:none; }
    .card{
      width:100%; max-width:420px; background:rgba(255,255,255,.06);
      border:1px solid var(--panel-border); border-radius:24px; padding:28px 24px;
      text-align:center;
    }
    .card .logo{ font-size:56px; }
    .card h2{ margin:12px 0 6px; font-size:24px; }
    .card p{ color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 18px; }
    .card input{
      width:100%; background:rgba(255,255,255,.08); border:1px solid var(--panel-border);
      border-radius:14px; color:var(--ink); font-size:18px; padding:14px; text-align:center;
      font-family:inherit; margin-bottom:12px;
    }
    .card input:focus{ outline:2px solid var(--amber); }
    .fam-code{
      font-size:26px; font-weight:800; letter-spacing:3px; color:var(--amber);
      background:rgba(242,169,59,.1); border:1px dashed var(--amber);
      border-radius:14px; padding:12px; margin:0 0 14px;
    }
    /* toast */
    #toast{
      position:fixed; left:50%; transform:translateX(-50%);
      bottom:calc(96px + env(safe-area-inset-bottom)); z-index:400;
      background:#0F3A4D; color:#fff; border:2px solid var(--amber);
      padding:12px 22px; border-radius:999px; font-size:14px; font-weight:800;
      opacity:0; transition:opacity .3s; pointer-events:none; max-width:92vw; text-align:center;
    }
    .gear{
      background:var(--panel); border:1px solid var(--panel-border); color:var(--ink);
      width:44px; height:44px; border-radius:14px; font-size:20px; cursor:pointer; flex:none;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-icon">🧺</div>
        <div>
          <h1>Family List</h1>
          <small id="fam-code-label">code: family</small>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="who-chip" id="who-chip" onclick="openNamePicker(false)">
          <span class="sync-dot" id="sync-dot"></span>
          <span id="who-name">…</span>
        </button>
        <button class="gear" onclick="openSettings()" aria-label="Settings">⚙️</button>
      </div>
    </div>
    <div class="listbar" id="listbar"></div>
  </header>

  <main class="wrap" id="main"></main>

  <button class="fab" id="fab" onclick="openAddSheet()">＋ Add item</button>
  <div id="toast"></div>

  <!-- Add / edit item sheet -->
  <div class="sheet-overlay" id="item-sheet">
    <div class="sheet">
      <div class="grabber"></div>
      <h3 id="sheet-title">Add item</h3>

      <div id="catalog-browser">
        <div class="field">
          <input id="cat-search" type="search" placeholder="🔍 Search groceries…" oninput="renderCatalog()" />
        </div>
        <div class="catchips" id="cat-chips"></div>
        <div id="cat-results" style="max-height:30vh;overflow-y:auto;margin-bottom:6px"></div>
        <button class="btn btn-ghost" onclick="showCustomForm()">✏️ Add a custom item instead</button>
      </div>

      <div id="custom-form" style="display:none">
        <div class="field">
          <label>Item name</label>
          <input id="f-name" placeholder="e.g. Whole milk" />
        </div>
        <div class="field">
          <label>Quantity</label>
          <div class="qty-row">
            <button class="qty-step" onclick="stepQty(-1)">−</button>
            <input id="f-qty" type="number" min="1" value="1" inputmode="numeric" />
            <button class="qty-step" onclick="stepQty(1)">＋</button>
            <select id="f-unit" style="max-width:110px">
              <option value="">—</option>
              <option>pcs</option><option>pack</option><option>dozen</option>
              <option>bag</option><option>box</option><option>can</option>
              <option>bottle</option><option>jar</option><option>bunch</option>
              <option>L</option><option>mL</option><option>kg</option>
              <option>g</option><option>lb</option><option>oz</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Special instructions</label>
          <textarea id="f-note" placeholder="e.g. 2% if they have it, no cilantro…"></textarea>
        </div>
        <div class="field">
          <label>Category</label>
          <select id="f-cat"></select>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="save-item-btn" onclick="saveItemForm()">Add item</button>
          <button class="btn btn-ghost" onclick="closeSheet()">Cancel</button>
        </div>
        <div id="edit-extra" style="display:none">
          <button class="btn btn-danger" onclick="deleteEditingItem()">Delete item</button>
        </div>
      </div>

    </div>
  </div>

  <!-- New list sheet -->
  <div class="sheet-overlay" id="list-sheet">
    <div class="sheet">
      <div class="grabber"></div>
      <h3>New shopping list</h3>
      <div class="field">
        <label>List name</label>
        <input id="nl-name" placeholder="e.g. Weekly groceries" />
      </div>
      <div class="field">
        <label>Store (optional)</label>
        <input id="nl-store" placeholder="e.g. Costco" />
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="createList()">Create list</button>
        <button class="btn btn-ghost" onclick="closeOverlays()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Settings sheet -->
  <div class="sheet-overlay" id="settings-sheet">
    <div class="sheet">
      <div class="grabber"></div>
      <h3>Settings</h3>
      <div class="field">
        <label>Your name</label>
        <input id="s-name" placeholder="e.g. Kevin" />
      </div>
      <div class="field">
        <label>Family code</label>
        <input id="s-code" placeholder="family" autocapitalize="none" spellcheck="false" />
        <p style="font-size:13px;color:var(--muted);line-height:1.5;margin:8px 0 0">
          Everyone in the family must enter the <b>same code</b> on their phone to share lists.
          Pick something unique like your last name.
        </p>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="saveSettings()">Save</button>
        <button class="btn btn-ghost" onclick="closeOverlays()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Name picker (first launch) -->
  <div class="fullscreen" id="name-picker">
    <div class="card">
      <div class="logo">🧺</div>
      <h2>Who's shopping?</h2>
      <p>Pick your name so the family knows who added or grabbed each item.</p>
      <input id="np-name" placeholder="Your name" maxlength="24" />
      <button class="btn btn-primary" onclick="saveNamePicker()">Start</button>
    </div>
  </div>

  <script>
    /* ═══ Grocery catalog ═══ */
    const CATEGORIES = ["Produce","Dairy & Eggs","Meat & Seafood","Bakery","Pantry & Dry Goods","Frozen","Beverages","Snacks","Pharmacy & Health","Household","Baby","Pets"];
    const CATALOG = {
      "Produce": ["Apples","Bananas","Oranges","Strawberries","Blueberries","Grapes","Lemons","Limes","Avocados","Tomatoes","Lettuce","Spinach","Carrots","Celery","Onions","Potatoes","Garlic","Bell Peppers","Cucumbers","Broccoli"],
      "Dairy & Eggs": ["Milk","Eggs","Butter","Cheddar Cheese","Mozzarella","Yogurt","Greek Yogurt","Cream Cheese","Sour Cream","Whipping Cream","Cottage Cheese","Parmesan","Ice Cream","Chocolate Milk","Margarine"],
      "Meat & Seafood": ["Chicken Breasts","Ground Beef","Bacon","Pork Chops","Salmon Fillets","Shrimp","Ground Turkey","Steak","Sausages","Ham","Turkey Breast","Canned Tuna","Hot Dogs","Chicken Thighs","Ribs"],
      "Bakery": ["White Bread","Whole Wheat Bread","Bagels","Croissants","Hamburger Buns","Tortillas","Muffins","Pita Bread","Dinner Rolls","Cake","Cookies","Donuts","Pizza Dough","English Muffins","Sliced Cheese Bread"],
      "Pantry & Dry Goods": ["Pasta","Rice","Canned Tomatoes","Black Beans","Peanut Butter","Flour","Sugar","Olive Oil","Vegetable Oil","Salt","Pepper","Ketchup","Mustard","Mayonnaise","Soy Sauce","Honey","Maple Syrup","Oats","Cereal","Crackers"],
      "Frozen": ["Frozen Peas","Frozen Mixed Berries","Frozen Pizza","Frozen Mixed Vegetables","French Fries","Chicken Nuggets","Frozen Shrimp","Waffles","Pierogies","Frozen Corn","Bagged Ice","Frozen Fruit Bars","Frozen Spinach","Frozen Meatballs"],
      "Beverages": ["Orange Juice","Apple Juice","Coffee","Tea","Soda","Sparkling Water","Bottled Water","Lemonade","Energy Drinks","Hot Chocolate","Almond Milk","Sports Drinks","Iced Tea","Beer","Wine"],
      "Snacks": ["Potato Chips","Tortilla Chips","Salsa","Popcorn","Pretzels","Granola Bars","Chocolate Bars","Mixed Nuts","Trail Mix","Rice Cakes","Cheese Puffs","Fruit Snacks","Hummus","Guacamole","Dried Fruit"],
      "Pharmacy & Health": ["Pain Reliever","Bandages","Multivitamins","Cold Medicine","Allergy Pills","Antacid","Sunscreen","Lip Balm","Hand Soap","Toothpaste","Shampoo","Deodorant","Razors","Tissues","Cough Syrup"],
      "Household": ["Paper Towels","Toilet Paper","Dish Soap","Laundry Detergent","Trash Bags","All-Purpose Cleaner","Sponges","Aluminum Foil","Plastic Wrap","Ziploc Bags","Batteries","Light Bulbs","Napkins","Bleach","Air Freshener"],
      "Baby": ["Diapers","Baby Wipes","Baby Formula","Baby Food","Diaper Cream","Baby Shampoo","Baby Lotion","Bottles","Pacifiers","Baby Cereal","Sippy Cups","Baby Laundry Detergent"],
      "Pets": ["Dog Food","Cat Food","Cat Litter","Dog Treats","Cat Treats","Pet Shampoo","Poop Bags","Bird Seed","Fish Food","Flea Treatment","Pet Toys","Litter Liners"]
    };

    /* ═══ Firebase ═══ */
    const firebaseConfig = {
      apiKey: "AIzaSyBAY7jYTvXm8rrAUN-JUwG9jtwuW1OOL2k",
      authDomain: "fishinglog-aa80c.firebaseapp.com",
      projectId: "fishinglog-aa80c",
      storageBucket: "fishinglog-aa80c.firebasestorage.app",
      messagingSenderId: "155190862369",
      appId: "1:155190862369:web:7c4e97c3bc4754dadbf960"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

    /* ═══ State ═══ */
    let myName = localStorage.getItem('fl_name') || '';
    let familyCode = localStorage.getItem('fl_familyCode') || 'family';
    let lists = [];
    let activeListId = localStorage.getItem('fl_activeList') || null;
    let unsubscribe = null;
    let editingItemId = null;
    let catalogCat = 'All';

    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
    const esc = s => (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtTime = ts => { try{ return new Date(ts).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } };

    function setSync(state){
      const d = document.getElementById('sync-dot');
      d.className = 'sync-dot' + (state === 'synced' ? '' : ' ' + state);
    }

    function toast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      clearTimeout(t._t);
      t._t = setTimeout(() => t.style.opacity = '0', 2200);
    }

    /* ═══ Firestore sync ═══ */
    function subscribe(){
      if(unsubscribe) unsubscribe();
      setSync('syncing');
      unsubscribe = db.collection('familylists')
        .where('familyCode', '==', familyCode)
        .onSnapshot(snap => {
          lists = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
          lists.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
          if(!lists.find(l => l.id === activeListId)){
            activeListId = lists.length ? lists[0].id : null;
            try{ localStorage.setItem('fl_activeList', activeListId || ''); }catch(e){}
          }
          render();
          setSync('synced');
        }, err => {
          console.error('Sync error:', err);
          setSync('offline');
          toast('Offline — changes will sync when reconnected');
        });
    }

    function activeList(){
      return lists.find(l => l.id === activeListId) || null;
    }

    function saveList(list){
      list.updatedAt = Date.now();
      setSync('syncing');
      return db.collection('familylists').doc(list.id).set({
        familyCode: list.familyCode,
        name: list.name,
        store: list.store || '',
        items: list.items || [],
        createdAt: list.createdAt || Date.now(),
        updatedAt: list.updatedAt
      }).catch(err => {
        console.error('Save failed:', err);
        setSync('offline');
        toast('Couldn’t save — check your connection');
      });
    }

    /* ═══ Rendering ═══ */
    function render(){
      document.getElementById('who-name').textContent = myName || '…';
      document.getElementById('fam-code-label').textContent = 'code: ' + familyCode;
      renderListbar();
      renderMain();
    }

    function renderListbar(){
      const bar = document.getElementById('listbar');
      let html = lists.map(l => {
        const n = (l.items || []).length;
        const done = (l.items || []).filter(i => i.checked).length;
        return `<button class="list-chip${l.id === activeListId ? ' on' : ''}" onclick="switchList('${l.id}')">${esc(l.name)} · ${done}/${n}</button>`;
      }).join('');
      html += `<button class="list-chip new" onclick="openListSheet()">＋ New list</button>`;
      bar.innerHTML = html;
    }

    function renderMain(){
      const main = document.getElementById('main');
      const list = activeList();
      document.getElementById('fab').style.display = list ? '' : 'none';
      if(!list){
        main.innerHTML = `<div class="empty"><span class="big">🧺</span>No shopping lists yet.<br/>Create your first list to get started.</div>`;
        return;
      }
      const items = list.items || [];
      const open = items.filter(i => !i.checked);
      const done = items.filter(i => i.checked);

      let html = `<div class="list-head">
        <h2>${esc(list.name)}</h2>
        ${list.store ? `<p class="store">🏪 ${esc(list.store)}</p>` : ''}
        <div class="progress"><div style="width:${items.length ? Math.round(done.length / items.length * 100) : 0}%"></div></div>
        <div class="list-meta">
          <span>${done.length} of ${items.length} done</span>
          <span>
            ${done.length ? `<button class="link-btn amber" onclick="clearDone()">Clear done</button>` : ''}
            <button class="link-btn" onclick="deleteList()">Delete list</button>
          </span>
        </div>
      </div>`;

      if(!items.length){
        html += `<div class="empty"><span class="big">🛒</span>This list is empty.<br/>Tap <b>＋ Add item</b> to start adding groceries.</div>`;
      } else {
        // group open items by category, in catalog order
        const groups = {};
        open.forEach(i => { const c = i.category || 'Other'; (groups[c] = groups[c] || []).push(i); });
        const order = c => { const ix = CATEGORIES.indexOf(c); return ix === -1 ? 999 : ix; };
        Object.keys(groups).sort((a, b) => order(a) - order(b)).forEach(cat => {
          html += `<div class="cat-group"><div class="cat-title">${esc(cat)}</div>`;
          groups[cat].forEach(i => { html += itemRow(i, false); });
          html += `</div>`;
        });
        if(done.length){
          html += `<button class="done-toggle" onclick="var d=document.getElementById('done-sec');d.style.display=d.style.display==='none'?'':'none'">
            ✓ Done (${done.length}) — tap to show/hide</button>
            <div id="done-sec" style="display:none">`;
          done.forEach(i => { html += itemRow(i, true); });
          html += `</div>`;
        }
      }
      main.innerHTML = html;
    }

    function itemRow(i, isDone){
      const qty = [i.qty > 1 ? i.qty : '', i.unit || ''].filter(Boolean).join(' ');
      return `<div class="item${isDone ? ' done' : ''}">
        <button class="check" onclick="toggleCheck('${i.id}')">✓</button>
        <div class="item-body" onclick="openEditSheet('${i.id}')">
          <div class="item-name">${esc(i.name)}${qty ? ` <span style="color:var(--amber);font-weight:800">× ${esc(qty)}</span>` : ''}</div>
          <div class="item-sub">${isDone && i.checkedBy ? `✓ ${esc(i.checkedBy)}${i.checkedAt ? ' · ' + fmtTime(i.checkedAt) : ''}` : `added by ${esc(i.addedBy || 'someone')}`}</div>
          ${i.note ? `<div class="item-note">📝 ${esc(i.note)}</div>` : ''}
        </div>
        <button class="item-edit" onclick="openEditSheet('${i.id}')" aria-label="Edit">✏️</button>
      </div>`;
    }

    /* ═══ Lists ═══ */
    function switchList(id){
      activeListId = id;
      try{ localStorage.setItem('fl_activeList', id); }catch(e){}
      render();
    }

    function openListSheet(){
      document.getElementById('nl-name').value = '';
      document.getElementById('nl-store').value = '';
      document.getElementById('list-sheet').classList.add('open');
      setTimeout(() => document.getElementById('nl-name').focus(), 100);
    }

    function createList(){
      const name = document.getElementById('nl-name').value.trim();
      if(!name){ toast('Give the list a name'); return; }
      const store = document.getElementById('nl-store').value.trim();
      const list = {
        id: uid(), familyCode, name, store,
        items: [], createdAt: Date.now(), updatedAt: Date.now()
      };
      closeOverlays();
      saveList(list).then(() => {
        activeListId = list.id;
        try{ localStorage.setItem('fl_activeList', list.id); }catch(e){}
        toast('List created');
      });
    }

    function deleteList(){
      const list = activeList();
      if(!list) return;
      if(!confirm(`Delete "${list.name}" and all its items?`)) return;
      setSync('syncing');
      db.collection('familylists').doc(list.id).delete()
        .catch(err => { console.error(err); toast('Couldn’t delete'); });
    }

    function clearDone(){
      const list = activeList();
      if(!list) return;
      list.items = (list.items || []).filter(i => !i.checked);
      saveList(list);
      toast('Cleared done items');
    }

    /* ═══ Items ═══ */
    function toggleCheck(id){
      const list = activeList();
      if(!list) return;
      const item = (list.items || []).find(i => i.id === id);
      if(!item) return;
      item.checked = !item.checked;
      if(item.checked){ item.checkedBy = myName; item.checkedAt = Date.now(); }
      else { item.checkedBy = null; item.checkedAt = null; }
      saveList(list);
    }

    function quickAdd(name, category){
      const list = activeList();
      if(!list){ toast('Create a list first'); return; }
      list.items = list.items || [];
      list.items.push({
        id: uid(), name, qty: 1, unit: '', note: '',
        category: category || 'Other',
        addedBy: myName, addedAt: Date.now(),
        checked: false, checkedBy: null, checkedAt: null
      });
      saveList(list);
      toast('Added ' + name);
    }

    function stepQty(d){
      const el = document.getElementById('f-qty');
      el.value = Math.max(1, (parseInt(el.value, 10) || 1) + d);
    }

    function openAddSheet(){
      if(!activeList()){ toast('Create a list first'); return; }
      editingItemId = null;
      document.getElementById('sheet-title').textContent = 'Add item';
      document.getElementById('save-item-btn').textContent = 'Add item';
      document.getElementById('edit-extra').style.display = 'none';
      document.getElementById('catalog-browser').style.display = '';
      document.getElementById('custom-form').style.display = 'none';
      document.getElementById('cat-search').value = '';
      catalogCat = 'All';
      renderCatalog();
      document.getElementById('item-sheet').classList.add('open');
    }

    function showCustomForm(name, category){
      document.getElementById('catalog-browser').style.display = 'none';
      document.getElementById('custom-form').style.display = '';
      document.getElementById('f-name').value = name || '';
      document.getElementById('f-qty').value = '1';
      document.getElementById('f-unit').value = '';
      document.getElementById('f-note').value = '';
      fillCatSelect(category || 'Produce');
      setTimeout(() => document.getElementById('f-name').focus(), 100);
    }

    function fillCatSelect(sel){
      document.getElementById('f-cat').innerHTML =
        CATEGORIES.map(c => `<option${c === sel ? ' selected' : ''}>${c}</option>`).join('') +
        `<option${sel === 'Other' ? ' selected' : ''}>Other</option>`;
    }

    function openEditSheet(id){
      const list = activeList();
      if(!list) return;
      const item = (list.items || []).find(i => i.id === id);
      if(!item) return;
      editingItemId = id;
      document.getElementById('sheet-title').textContent = 'Edit item';
      document.getElementById('save-item-btn').textContent = 'Save changes';
      document.getElementById('edit-extra').style.display = '';
      document.getElementById('catalog-browser').style.display = 'none';
      document.getElementById('custom-form').style.display = '';
      document.getElementById('f-name').value = item.name || '';
      document.getElementById('f-qty').value = item.qty || 1;
      document.getElementById('f-unit').value = item.unit || '';
      document.getElementById('f-note').value = item.note || '';
      fillCatSelect(item.category || 'Produce');
      document.getElementById('item-sheet').classList.add('open');
    }

    function saveItemForm(){
      const list = activeList();
      if(!list) return;
      const name = document.getElementById('f-name').value.trim();
      if(!name){ toast('Enter an item name'); return; }
      const data = {
        name,
        qty: Math.max(1, parseInt(document.getElementById('f-qty').value, 10) || 1),
        unit: document.getElementById('f-unit').value,
        note: document.getElementById('f-note').value.trim(),
        category: document.getElementById('f-cat').value
      };
      list.items = list.items || [];
      if(editingItemId){
        const item = list.items.find(i => i.id === editingItemId);
        if(item) Object.assign(item, data);
        toast('Saved');
      } else {
        list.items.push(Object.assign({
          id: uid(), addedBy: myName, addedAt: Date.now(),
          checked: false, checkedBy: null, checkedAt: null
        }, data));
        toast('Added ' + name);
      }
      closeSheet();
      saveList(list);
    }

    function deleteEditingItem(){
      const list = activeList();
      if(!list || !editingItemId) return;
      if(!confirm('Delete this item?')) return;
      list.items = (list.items || []).filter(i => i.id !== editingItemId);
      closeSheet();
      saveList(list);
      toast('Item deleted');
    }

    function closeSheet(){
      document.getElementById('item-sheet').classList.remove('open');
      editingItemId = null;
    }

    function renderCatalog(){
      const q = document.getElementById('cat-search').value.trim().toLowerCase();
      const chips = document.getElementById('cat-chips');
      chips.innerHTML = ['All', ...CATEGORIES].map(c =>
        `<button class="catchip${c === catalogCat ? ' on' : ''}" onclick="setCatalogCat('${c.replace(/'/g, "\\'")}')">${c}</button>`
      ).join('');
      let results = [];
      Object.keys(CATALOG).forEach(cat => {
        if(catalogCat !== 'All' && cat !== catalogCat) return;
        CATALOG[cat].forEach(name => {
          if(q && !name.toLowerCase().includes(q)) return;
          results.push({ name, cat });
        });
      });
      results = results.slice(0, 60);
      document.getElementById('cat-results').innerHTML = results.length
        ? results.map(r => `<div class="cat-result">
            <span class="nm" onclick="showCustomForm('${r.name.replace(/'/g, "\\'")}', '${r.cat.replace(/'/g, "\\'")}')">${esc(r.name)}</span>
            <span class="ct">${esc(r.cat)}</span>
            <button class="mini-add" onclick="quickAdd('${r.name.replace(/'/g, "\\'")}', '${r.cat.replace(/'/g, "\\'")}')">＋</button>
          </div>`).join('')
        : `<div class="empty" style="padding:20px">No matches — try the custom form.</div>`;
    }

    function setCatalogCat(c){
      catalogCat = c;
      renderCatalog();
    }

    /* ═══ Name picker & settings ═══ */
    function openNamePicker(){
      document.getElementById('np-name').value = myName;
      document.getElementById('name-picker').classList.remove('hidden');
      setTimeout(() => document.getElementById('np-name').focus(), 100);
    }

    function saveNamePicker(){
      const v = document.getElementById('np-name').value.trim();
      if(!v){ toast('Enter your name'); return; }
      myName = v;
      try{ localStorage.setItem('fl_name', myName); }catch(e){}
      document.getElementById('name-picker').classList.add('hidden');
      render();
    }

    function openSettings(){
      document.getElementById('s-name').value = myName;
      document.getElementById('s-code').value = familyCode;
      document.getElementById('settings-sheet').classList.add('open');
    }

    function saveSettings(){
      const name = document.getElementById('s-name').value.trim();
      const code = document.getElementById('s-code').value.trim() || 'family';
      const codeChanged = code !== familyCode;
      if(name) myName = name;
      familyCode = code;
      try{
        localStorage.setItem('fl_name', myName);
        localStorage.setItem('fl_familyCode', familyCode);
      }catch(e){}
      closeOverlays();
      if(codeChanged){
        activeListId = null;
        subscribe();
        toast('Switched to family code: ' + familyCode);
      } else {
        render();
      }
    }

    function closeOverlays(){
      document.querySelectorAll('.sheet-overlay').forEach(o => o.classList.remove('open'));
      editingItemId = null;
    }

    // tap outside a sheet to close it
    document.querySelectorAll('.sheet-overlay').forEach(o => {
      o.addEventListener('click', e => { if(e.target === o) closeOverlays(); });
    });
    document.getElementById('np-name').addEventListener('keydown', e => {
      if(e.key === 'Enter') saveNamePicker();
    });

    /* ═══ Boot ═══ */
    (function boot(){
      document.getElementById('who-name').textContent = myName || '…';
      document.getElementById('fam-code-label').textContent = 'code: ' + familyCode;
      if(!myName){
        document.getElementById('name-picker').classList.remove('hidden');
      } else {
        document.getElementById('name-picker').classList.add('hidden');
      }
      window.addEventListener('offline', () => setSync('offline'));
      window.addEventListener('online', () => setSync('syncing'));
      subscribe();
    })();
  </script>
</body>
</html>
